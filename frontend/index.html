<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TraceGaurd</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#e9eef8;background:#070b13}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#16213a,#070b13 42%);min-height:100vh}button,input{font:inherit}.wrap{min-height:100vh;padding:24px}.login,.app{max-width:1450px;margin:auto}.login{display:grid;place-items:center;min-height:calc(100vh - 48px)}.card{background:#0d1422;border:1px solid #263650;border-radius:20px;padding:30px;box-shadow:0 30px 90px #0008}.login .card{width:min(430px,100%)}h1,h2,h3,p{margin-top:0}.brand{font-weight:800;font-size:22px;color:#fff}.muted{color:#7e91ad}.form{display:grid;gap:12px;margin-top:22px}.form input{background:#09101b;border:1px solid #2b3952;border-radius:10px;padding:12px;color:white}.btn{border:0;border-radius:10px;padding:11px 15px;background:#2563eb;color:white;font-weight:700;cursor:pointer}.btn.alt{background:#172337;border:1px solid #2a3b58}.err{background:#451b24;border:1px solid #71303b;color:#fecaca;padding:10px;border-radius:9px;margin-top:12px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.status{font-size:13px;color:#8fa2bd}.status b{color:#4ade80}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{padding:17px}.stat small{color:#71849f}.stat strong{display:block;font-size:27px;margin-top:6px}.grid{display:grid;grid-template-columns:.9fr 1.5fr;gap:16px;margin-top:16px}.panel{padding:20px;min-height:500px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #1b2638;padding-bottom:14px;margin-bottom:10px}.incident{padding:13px;border:1px solid transparent;border-radius:11px;cursor:pointer;display:flex;gap:12px;align-items:center}.incident:hover,.incident.sel{background:#101b2c;border-color:#2a3a55}.sev{font-size:9px;text-transform:uppercase;font-weight:800;padding:5px 7px;border-radius:5px;background:#4a1f2b;color:#fda4af}.incident span{display:block;color:#71839d;font-size:12px;margin-top:4px}.cause{display:flex;justify-content:space-between;gap:12px;padding:15px;background:#0e1929;border:1px solid #263853;border-radius:13px}.cause small{color:#6e86a6}.cause strong{font-size:28px;color:#67e8f9}.trace{margin-top:14px}.row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #172133}.num{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;background:#152743;color:#7dd3fc;font-size:11px;flex:none}.row p{font-size:12px;color:#778aa6;margin:3px 0 0}.done{margin-left:auto;color:#4ade80;font-size:11px}.section{margin-top:16px}.section h3{font-size:13px}.item{padding:8px 0;color:#93a4bb;font-size:12px;border-top:1px solid #172133}.action{display:flex;justify-content:space-between;align-items:center;gap:12px}.approve{background:#243a26;border:1px solid #31563a;color:#a7f3d0}.empty{min-height:320px;display:grid;place-items:center;text-align:center;color:#71839e;line-height:1.6}.logout{margin-left:10px;background:transparent;color:#8192aa;border:1px solid #2a3850;border-radius:8px;padding:8px 11px;cursor:pointer}@media(max-width:950px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:600px){.stats{grid-template-columns:1fr}.wrap{padding:12px}.head,.top{align-items:flex-start;flex-direction:column}}</style></head><body><div id="root"></div><script>const API=localStorage.getItem('trace_api')||location.protocol+'//'+location.hostname+':8000';let token=localStorage.getItem('trace_token'),incidentId='INC-1001',analysis=null;const $=id=>document.getElementById(id);async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json',Authorization:token?'Bearer '+token:''}});const d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');return d}function renderLogin(msg=''){document.body.innerHTML='<div class="wrap"><div class="login"><div class="card"><div class="brand">◈ TraceGaurd</div><p class="muted">Multi-Agent AI Incident Commander</p><div class="form"><input id="email" value="engineer@tracegaurd.ai"><input id="password" type="password" value="TraceGaurd@123"><button class="btn" onclick="login()">Sign in</button></div>'+(msg?'<div class="err">'+msg+'</div>':'')+'<p class="muted" style="font-size:12px;margin-top:16px">Demo: engineer@tracegaurd.ai / TraceGaurd@123</p></div></div></div>'}async function login(){try{const d=await api('/api/v1/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});token=d.access_token;localStorage.setItem('trace_token',token);render();}catch(e){renderLogin(e.message)}}async function simulate(){try{await api('/api/v1/simulate/payment-db-timeout',{method:'POST'});await render()}catch(e){alert(e.message)}}async function investigate(){try{analysis=await api('/api/v1/incidents/'+incidentId+'/analysis');render()}catch(e){alert(e.message)}}async function approve(){try{const a=await api('/api/v1/incidents/'+incidentId+'/approve',{method:'POST',body:JSON.stringify({action:'rollback_deployment',approved:true})});await api('/api/v1/incidents/'+incidentId+'/execute',{method:'POST',body:JSON.stringify({action:'rollback_deployment',approval_id:a.approval_id})});analysis=await api('/api/v1/incidents/'+incidentId+'/analysis');render()}catch(e){alert(e.message)}}async function render(){if(!token)return renderLogin();try{const [inc,met]=await Promise.all([api('/api/v1/incidents'),api('/api/v1/metrics')]);document.body.innerHTML='<div class="wrap"><div class="app"><div class="top"><div><div class="muted" style="font-size:11px;letter-spacing:.16em">OPERATIONS CONTROL PLANE</div><h1>TraceGaurd Command Center</h1></div><div class="status"><b>●</b> Operational <button class="logout" onclick="localStorage.removeItem(\'trace_token\');location.reload()">Logout</button></div></div><div class="stats"><div class="card stat"><small>Active incidents</small><strong>'+met.active_incidents+'</strong></div><div class="card stat"><small>Clients monitored</small><strong>'+met.clients_monitored+'</strong></div><div class="card stat"><small>Human approvals</small><strong>'+met.human_approvals+'</strong></div><div class="card stat"><small>Actions executed</small><strong>'+met.actions_executed+'</strong></div></div><div class="grid"><div class="card panel"><div class="head"><div><h2>Incident queue</h2><p class="muted">Signals from monitored clients</p></div><button class="btn alt" onclick="simulate()">Simulate incident</button></div>'+(inc.length?inc.map(i=>'<div class="incident '+(i.incident_id===incidentId?'sel':'')+'" onclick="incidentId=\''+i.incident_id+'\';analysis=null;render()"><div class="sev">'+i.severity+'</div><div><b>'+i.title+'</b><span>'+i.incident_id+' · '+i.event_count+' signals · '+i.status+'</span></div></div>').join(''):'<div class="empty">No incidents yet. Simulate a client incident to begin.</div>')+'</div><div class="card panel"><div class="head"><div><h2>AI investigation</h2><p class="muted">Correlation → RAG → root cause → guardrail</p></div><button class="btn" onclick="investigate()">Analyze</button></div>'+(!analysis?'<div class="empty">Run an investigation to see the agent trace, evidence-backed root cause, diagnostic steps and remediation policy.</div>':'<div class="cause"><div><small>ROOT-CAUSE HYPOTHESIS</small><h3>'+analysis.root_cause+'</h3></div><strong>'+analysis.confidence+'%</strong></div><div class="trace">'+analysis.agent_trace.map((x,i)=>'<div class="row"><span class="num">'+(i+1)+'</span><div><b>'+x.agent+'</b><p>'+x.detail+'</p></div><span class="done">done</span></div>').join('')+'</div><div class="section"><h3>RAG evidence</h3>'+analysis.rag_context.map(x=>'<div class="item">• '+x+'</div>').join('')+'</div><div class="section"><h3>Diagnostic steps</h3>'+analysis.diagnosis_steps.map(x=>'<div class="item"><b>'+x.step+'. '+x.action+'</b><div class="muted">Expected: '+x.expected+'</div></div>').join('')+'</div><div class="section"><h3>Guardrails</h3>'+analysis.actions.map(a=>'<div class="item action"><div><b>'+a.action+'</b><div class="muted">'+a.reason+'</div></div>'+(a.risk==='APPROVAL'?'<button class="approve" onclick="approve()">Approve & execute</button>':'<span class="done">'+a.status+'</span>')+'</div>').join('')+'</div>')+'</div></div></div></div>'}catch(e){localStorage.removeItem('trace_token');renderLogin(e.message)}}render();</script></body></html>
